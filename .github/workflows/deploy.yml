name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy
        type: choice
        options: [all, hub, bbq]
        default: all

# One deploy at a time. A newer push waits instead of cancelling a deploy half-way.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  plan:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Cloudflare is set up
        id: ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Deploy skipped: the CLOUDFLARE_API_TOKEN secret is not set yet. See docs/DEPLOY.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -l '00000000-0000-0000-0000-000000000000' apps/*/wrangler.jsonc; then
            echo "::error::The files above still have the placeholder database_id. See docs/DEPLOY.md."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Changes under apps/<app>/ deploy that app; docs deploy nothing; anything else
      # (shared packages, dependencies, workflows) deploys every app.
      - name: Pick apps to deploy
        id: apps
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APP: ${{ inputs.app }}
          BEFORE: ${{ github.event.before }}
        run: |
          all=$(ls apps)
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$INPUT_APP" = all ]; then picked=$all; else picked=$INPUT_APP; fi
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            picked=$all
          else
            picked=""
            for f in $(git diff --name-only "$BEFORE" HEAD); do
              case "$f" in
                apps/*/*) app=${f#apps/}; picked="$picked ${app%%/*}" ;;
                docs/*|*.md) ;;
                *) picked=$all; break ;;
              esac
            done
          fi
          apps=$(for app in $picked; do if [ -d "apps/$app" ]; then echo "$app"; fi; done | sort -u | jq -R . | jq -sc .)
          echo "Apps to deploy: $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  migrate:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Every app's migrations, hub first because other apps' tables may refer to people.
      # Migrations only add (docs/DESIGN.md §10), so running them before the new code is safe.
      - name: Apply D1 migrations
        run: |
          npm run db:migrate:remote -w apps/hub
          for dir in apps/*; do
            [ "$dir" = apps/hub ] && continue
            npm run db:migrate:remote -w "$dir"
          done

  deploy:
    needs: [plan, migrate]
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w "apps/$APP"
      - run: npm run deploy -w "apps/$APP"
